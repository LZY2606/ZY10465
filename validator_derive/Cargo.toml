[package]
name = "validator_derive"
version = "0.20.1"
authors = ["Vincent Prouillet <hello@vincentprouillet.com>"]
license = "MIT"
description = "Macros 1.1 implementation of #[derive(Validate)]"
homepage = "https://github.com/Keats/validator"
repository = "https://github.com/Keats/validator"
keywords = ["validation", "api", "validator"]
edition = "2024"
readme = "../README.md"
rust-version = { workspace = true }

[lib]
proc-macro = true

[dependencies]
syn = "2"
quote = "1"
proc-macro2 = "1"
proc-macro-error3 = "3"
darling = { version = "0.23", features = ["suggestions"] }

[features]
# Deprecated no-op kept for feature-name compatibility.
#
# Forwarding to `proc-macro-error3/nightly` pulls in
# `#![feature(proc_macro_diagnostic)]`, which fails with E0554 on any
# non-nightly rustc. Because `--all-features` enables every feature in the
# workspace, that forwarding made `cargo test --workspace --all-features`
# uncompilable on stable/MSRV toolchains, so the feature-combination gate
# (see docs/feature-matrix.md) requires this feature to stay a no-op until
# proc-macro-error3 offers toolchain-conditional activation.
nightly_features = []
